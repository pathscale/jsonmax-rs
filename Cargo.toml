[workspace]
resolver = "3"
exclude = ["bench/harness", "bench/dcheck", "bench/native", "bench/icount", "crates/jmax-native-fixtures/fuzz"]
members = [
  "crates/jsonmax",
  "crates/jsonmax-derive",
  "crates/jmax-compat",
  "crates/jmax-validator",
  "crates/jmax-runner",
  "crates/jmax-bench",
  "crates/jmax-fuzz",
  "crates/jmax-native-fixtures",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pathscale/jsonmax-rs"

[workspace.dependencies]
bytes = { version = "1", default-features = false }
ps-simdutf8 = { version = "0.1.6", default-features = false }
rusty_alloc = { package = "ps-rusty_alloc", version = "2.3.3" }
nagoya = { version = "0.1.19", default-features = false, features = ["std"] }
nago-http = { version = "0.1.5", default-features = false }
nago-wss = { version = "0.3.0", default-features = false }
jmax-compat = { path = "crates/jmax-compat", version = "0.1.0", default-features = false }
jmax-validator = { path = "crates/jmax-validator", version = "0.1.0", default-features = false }
jmax-runner = { path = "crates/jmax-runner", version = "0.1.0", default-features = false }
jmax-bench = { path = "crates/jmax-bench", version = "0.1.0", default-features = false }
jmax-fuzz = { path = "crates/jmax-fuzz", version = "0.1.0", default-features = false }
jsonmax = { path = "crates/jsonmax", version = "0.1.0", default-features = false }
jsonmax-derive = { path = "crates/jsonmax-derive", version = "0.1.0" }
