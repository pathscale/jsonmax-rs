[package]
name = "jmax-icount"
version = "0.1.0"
publish = false
edition = "2024"

[dependencies]
jsonmax = { path = "../../crates/jsonmax", features = ["std"] }
serde = "1"
serde_derive = "1"
serde_json = "1"
rusty_alloc = { package = "ps-rusty_alloc", version = "2.3.3" }
jiter = "0.17.0"
json = "0.12.4"
simd-json = "0.18.1"
sonic-rs = "0.5.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[workspace]
