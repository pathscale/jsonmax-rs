[package]
name = "jmax-native-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jsonmax = { path = "../../crates/jsonmax", features = ["std"] }
ps-pikkr = { path = "../../../ps-pikkr" }
serde = "1"
serde_derive = "1"
serde_json = "1"
simd-json = "0.18.1"
sonic-rs = "0.5.10"
jiter = "0.17.0"
json = "0.12.4"
rusty_alloc = { package = "ps-rusty_alloc", version = "2.3.3" }
jmax-native-fixtures = { path = "../../crates/jmax-native-fixtures" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[workspace]

[features]
system-alloc = []
# Per-route trace tables on stderr (jsonmax::trace marks after each timed route).
trace = ["jsonmax/trace"]
