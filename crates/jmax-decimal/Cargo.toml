[package]
name = "jmax-decimal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Records per-site cycle counts through jmax-trace (off: marks compile to nothing).
trace = ["jmax-trace/trace"]
default = ["std"]
alloc = ["jmax-abi/alloc"]
std = ["alloc", "jmax-abi/std"]

[dependencies]
jmax-trace = { workspace = true }
jmax-abi = { workspace = true }
