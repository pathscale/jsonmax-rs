[package]
name = "jmax-dom"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Records per-site cycle counts through jmax-trace (off: marks compile to nothing).
trace = ["jmax-trace/trace"]
default = ["std"]
alloc = ["jmax-abi/alloc", "jmax-syntax/alloc"]
std = ["alloc", "jmax-abi/std", "jmax-syntax/std"]

[dependencies]
jmax-trace = { workspace = true }
jmax-abi = { workspace = true }
jmax-syntax = { workspace = true }
jmax-utf8 = { workspace = true }
jmax-dispatch = { workspace = true }
