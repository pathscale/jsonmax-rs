[package]
name = "jmax-nagoya"
description = "Runtime-independent CPU jobs and resource admission for PathScale"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Enables the std feature in jmax-abi; the crate itself remains no_std.
default = ["std"]
# Enables heap-backed APIs without enabling std.
alloc = ["jmax-abi/alloc"]
# Enables standard-library support in jmax-abi.
std = ["alloc", "jmax-abi/std"]
# Adds reactive scheduling on the Nagoya runtime.
nagoya-rt = ["dep:nagoya"]

[dependencies]
jmax-abi = { workspace = true }
jmax-buffer = { workspace = true }
jmax-syntax = { workspace = true }
jmax-schema-vm = { workspace = true }
nagoya = { workspace = true, optional = true }
