[package]
name = "jmax-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Records per-site cycle counts through jmax-trace (off: marks compile to nothing).
trace = ["jmax-trace/trace"]
default = ["std"]
alloc = ["jmax-abi/alloc"]
std = ["alloc", "jmax-abi/std"]

[dependencies]
jmax-trace = { workspace = true }
jmax-abi = { workspace = true }
jmax-number = { workspace = true }
jmax-decimal = { workspace = true }
jmax-format = { workspace = true }
jmax-string = { workspace = true }
jmax-syntax = { workspace = true }
jmax-schema-compile = { workspace = true }
jmax-schema-vm = { workspace = true }

[dev-dependencies]
jmax-schema-ir = { workspace = true }
jmax-schema-aot = { workspace = true }
jmax-endpoint-model = { workspace = true }
jmax-endpoint-ron = { workspace = true }
