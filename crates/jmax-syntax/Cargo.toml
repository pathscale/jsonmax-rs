[package]
name = "jmax-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Records per-site cycle counts through jmax-trace (off: marks compile to nothing).
trace = ["jmax-trace/trace"]
default = ["std"]
alloc = ["jmax-abi/alloc"]
std = ["alloc", "jmax-abi/std", "jmax-dispatch/std"]

[dependencies]
jmax-trace = { workspace = true }
jmax-abi = { workspace = true }
jmax-dispatch = { workspace = true }
jmax-utf8 = { workspace = true }
jmax-string = { workspace = true }
jmax-number = { workspace = true }
jmax-buffer = { workspace = true }
jmax-error = { workspace = true }
