[package]
name = "jmax-wss"
description = "Bounded WebSocket message handling for PathScale"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Enables the std feature in jmax-abi; the crate itself remains no_std.
default = ["std"]
# Enables heap-backed APIs without enabling std.
alloc = ["jmax-abi/alloc"]
# Enables standard-library support in jmax-abi and the optional transport.
std = ["alloc", "jmax-abi/std", "nago-wss?/std"]
# Adds the Nagoya WebSocket transport adapter.
nago-wss-transport = ["dep:nago-wss"]

[dependencies]
jmax-abi = { workspace = true }
jmax-buffer = { workspace = true }
jmax-wire = { workspace = true }
jmax-mcp = { workspace = true }
jmax-schema-vm = { workspace = true }
jmax-nagoya = { workspace = true }
bytes = { workspace = true }
nago-wss = { workspace = true, optional = true }
