[package]
name = "jsonmax"
description = "JSON parsing, querying, schema validation, and encoding for PathScale"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["json", "simd", "parser", "schema", "serialization"]
categories = ["parser-implementations", "encoding", "no-std"]

[features]
# Enables standard-library support by default.
default = ["std"]
# Enables heap-backed APIs without enabling std.
alloc = []
# Enables standard-library support.
std = ["alloc", "bytes/std", "nago-wss?/std"]
# Compatibility flag; complete-slice UTF-8 validation always uses SIMD.
simd-utf8 = []
# Adds reactive scheduling on the Nagoya runtime.
nagoya-rt = ["dep:nagoya"]
# Adds the Nagoya HTTP client adapter.
nago-http-client = ["dep:nago-http"]
# Adds the Nagoya WebSocket transport adapter.
nago-wss-transport = ["dep:nago-wss"]
# Exposes the optional RustyAlloc allocator adapter.
rusty-alloc = ["std", "dep:rusty_alloc"]
# Builds the jsonmax-gen code generator (module jsonmax::cli and the binary).
cli = ["rusty-alloc"]

[dependencies]
bytes = { workspace = true }
ps-simdutf8 = { workspace = true }
rusty_alloc = { workspace = true, optional = true }
nagoya = { workspace = true, optional = true }
nago-http = { workspace = true, optional = true }
nago-wss = { workspace = true, optional = true }

[dev-dependencies]
jsonmax-derive = { path = "../jsonmax-derive" }

[[bin]]
name = "jsonmax-gen"
path = "src/bin/jsonmax-gen.rs"
required-features = ["cli"]

[[test]]
name = "cli__native"
required-features = ["cli"]
