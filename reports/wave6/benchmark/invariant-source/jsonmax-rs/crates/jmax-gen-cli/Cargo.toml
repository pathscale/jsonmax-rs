[package]
name = "jmax-gen-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "jsonmax-gen"
path = "src/main.rs"

[features]
default = ["std"]
alloc = ["jmax-abi/alloc"]
std = ["alloc", "jmax-abi/std"]

[dependencies]
jmax-abi = { workspace = true }
jmax-endpoint-ron = { workspace = true }
jmax-codegen-rust = { workspace = true }
jmax-codegen-spec = { workspace = true }
jmax-schema-aot = { workspace = true }
rusty_alloc = { workspace = true }
