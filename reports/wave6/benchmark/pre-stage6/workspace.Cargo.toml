jmax-path = { path = "crates/jmax-path", version = "0.1.0", default-features = false }
jmax-dom = { path = "crates/jmax-dom", version = "0.1.0", default-features = false }
jmax-schema-ir = { path = "crates/jmax-schema-ir", version = "0.1.0", default-features = false }
