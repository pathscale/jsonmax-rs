jmax-schema-vm = { path = "crates/jmax-schema-vm", version = "0.1.0", default-features = false }
jmax-format = { path = "crates/jmax-format", version = "0.1.0", default-features = false }
jmax-encode = { path = "crates/jmax-encode", version = "0.1.0", default-features = false }
