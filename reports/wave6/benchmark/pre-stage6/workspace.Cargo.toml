[workspace]
resolver = "3"
members = [
  "crates/jmax-abi",
  "crates/jmax-buffer",
  "crates/jmax-error",
  "crates/jmax-dispatch",
  "crates/jmax-scan-scalar",
  "crates/jmax-scan-neon",
  "crates/jmax-scan-avx2",
  "crates/jmax-scan-avx512",
  "crates/jmax-utf8",
  "crates/jmax-string",
  "crates/jmax-number",
  "crates/jmax-decimal",
  "crates/jmax-syntax",
  "crates/jmax-cursor",
  "crates/jmax-path",
  "crates/jmax-dom",
  "crates/jmax-schema-ir",
  "crates/jmax-schema-compile",
  "crates/jmax-schema-vm",
  "crates/jmax-format",
  "crates/jmax-encode",
  "crates/jmax-derive",
  "crates/jmax-schema-aot",
  "crates/jmax-endpoint-model",
  "crates/jmax-endpoint-ron",
  "crates/jmax-codegen-rust",
  "crates/jmax-codegen-spec",
  "crates/jmax-wire",
  "crates/jmax-mcp",
  "crates/jmax-nagoya",
  "crates/jmax-http",
  "crates/jmax-wss",
  "crates/jmax-exchange",
  "crates/jmax-compat",
  "crates/jmax-gen-cli",
  "crates/jmax-validator",
  "crates/jmax-runner",
  "crates/jmax-bench",
  "crates/jmax-fuzz",
  "crates/jsonmax",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bytes = { version = "1", default-features = false }
ps-simdutf8 = { path = "../ps-simdutf8", default-features = false }
rusty_alloc = { package = "ps-rusty_alloc", path = "../ps-rusty_alloc" }
nagoya = { path = "../nagoya", default-features = false, features = ["std"] }
nago-http = { path = "../nago-http", default-features = false }
nago-wss = { path = "../nago-wss", default-features = false }
all_crates_marker = "0.1.0"
jmax-abi = { path = "crates/jmax-abi", version = "0.1.0", default-features = false }
jmax-buffer = { path = "crates/jmax-buffer", version = "0.1.0", default-features = false }
jmax-error = { path = "crates/jmax-error", version = "0.1.0", default-features = false }
jmax-dispatch = { path = "crates/jmax-dispatch", version = "0.1.0", default-features = false }
jmax-scan-scalar = { path = "crates/jmax-scan-scalar", version = "0.1.0", default-features = false }
jmax-scan-neon = { path = "crates/jmax-scan-neon", version = "0.1.0", default-features = false }
jmax-scan-avx2 = { path = "crates/jmax-scan-avx2", version = "0.1.0", default-features = false }
jmax-scan-avx512 = { path = "crates/jmax-scan-avx512", version = "0.1.0", default-features = false }
jmax-utf8 = { path = "crates/jmax-utf8", version = "0.1.0", default-features = false }
jmax-string = { path = "crates/jmax-string", version = "0.1.0", default-features = false }
